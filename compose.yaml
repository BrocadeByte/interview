name: ai-interview

x-backend-environment: &backend-environment
  DATABASE_URL: "mysql+aiomysql://${MYSQL_USER:-ai_interview}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}@mysql:3306/${MYSQL_DATABASE:-ai_interview}?charset=utf8mb4"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.production}"
  REFRESH_JWT_SECRET_KEY: "${REFRESH_JWT_SECRET_KEY:?Set REFRESH_JWT_SECRET_KEY in .env.production}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-15}"
  REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-30}"
  REFRESH_TOKEN_REUSE_GRACE_SECONDS: "${REFRESH_TOKEN_REUSE_GRACE_SECONDS:-10}"
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
  AUTH_COOKIE_SAMESITE: "${AUTH_COOKIE_SAMESITE:-lax}"
  HEALTHCHECK_TIMEOUT_SECONDS: "${HEALTHCHECK_TIMEOUT_SECONDS:-2}"

  OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env.production}"
  OPENAI_API_BASE: "${OPENAI_API_BASE:-https://api.deepseek.com}"
  OPENAI_MODEL: "${OPENAI_MODEL:-deepseek-v4-flash}"
  RESUME_PARSE_MODEL: "${RESUME_PARSE_MODEL:-}"
  RESUME_PARSE_TIMEOUT_SECONDS: "${RESUME_PARSE_TIMEOUT_SECONDS:-120}"
  RESUME_PARSE_JSON_MODE: "${RESUME_PARSE_JSON_MODE:-true}"
  RESUME_PARSE_THINKING_MODE: "${RESUME_PARSE_THINKING_MODE:-disabled}"

  RABBITMQ_URL: "amqp://${RABBITMQ_USER:-ai_interview}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.production}@${RABBITMQ_HOST:-rabbitmq}:${RABBITMQ_PORT:-5672}/"
  RABBITMQ_INGESTION_QUEUE: "${RABBITMQ_INGESTION_QUEUE:-knowledge.ingestion}"
  RABBITMQ_INGESTION_EXCHANGE: "${RABBITMQ_INGESTION_EXCHANGE:-knowledge.ingestion.exchange}"
  RABBITMQ_INGESTION_DLX: "${RABBITMQ_INGESTION_DLX:-knowledge.ingestion.dlx}"
  RABBITMQ_RESUME_QUEUE: "${RABBITMQ_RESUME_QUEUE:-resume.parsing}"
  RABBITMQ_RESUME_EXCHANGE: "${RABBITMQ_RESUME_EXCHANGE:-resume.parsing.exchange}"
  RABBITMQ_RESUME_DLX: "${RABBITMQ_RESUME_DLX:-resume.parsing.dlx}"
  RABBITMQ_PREFETCH_COUNT: "${RABBITMQ_PREFETCH_COUNT:-2}"
  RABBITMQ_CONNECT_TIMEOUT_SECONDS: "${RABBITMQ_CONNECT_TIMEOUT_SECONDS:-10}"

  QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
  QDRANT_COLLECTION_NAME: "${QDRANT_COLLECTION_NAME:-knowledge_documents}"
  EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-dashscope}"
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-v4}"
  EMBEDDING_DIM: "${EMBEDDING_DIM:-1024}"
  EMBEDDING_SCORE_THRESHOLD: "${EMBEDDING_SCORE_THRESHOLD:-0.35}"
  EMBEDDING_TIMEOUT_SECONDS: "${EMBEDDING_TIMEOUT_SECONDS:-30}"
  ALLOW_HASH_EMBEDDINGS: "${ALLOW_HASH_EMBEDDINGS:-false}"
  DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
  RERANK_ENABLED: "${RERANK_ENABLED:-true}"
  RERANK_MODEL: "${RERANK_MODEL:-gte-rerank-v2}"
  RERANK_TIMEOUT_SECONDS: "${RERANK_TIMEOUT_SECONDS:-20}"
  DASHSCOPE_RERANK_URL: "${DASHSCOPE_RERANK_URL:-https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}"
  RAG_DENSE_CANDIDATE_LIMIT: "${RAG_DENSE_CANDIDATE_LIMIT:-30}"
  RAG_BM25_CANDIDATE_LIMIT: "${RAG_BM25_CANDIDATE_LIMIT:-30}"
  RAG_RERANK_LIMIT: "${RAG_RERANK_LIMIT:-8}"
  RAG_ADJACENT_CHUNK_WINDOW: "${RAG_ADJACENT_CHUNK_WINDOW:-1}"
  RAG_CONTEXT_TOKEN_BUDGET: "${RAG_CONTEXT_TOKEN_BUDGET:-6000}"
  RAGAS_EVALUATOR_MODEL: "${RAGAS_EVALUATOR_MODEL:-}"
  RAGAS_EVALUATION_TIMEOUT_SECONDS: "${RAGAS_EVALUATION_TIMEOUT_SECONDS:-120}"
  RAGAS_MAX_CONCURRENCY: "${RAGAS_MAX_CONCURRENCY:-2}"

  ALIYUN_OSS_REGION: "${ALIYUN_OSS_REGION:-}"
  ALIYUN_OSS_BUCKET: "${ALIYUN_OSS_BUCKET:-}"
  ALIYUN_OSS_ENDPOINT: "${ALIYUN_OSS_ENDPOINT:-}"
  ALIYUN_OSS_PREFIX: "${ALIYUN_OSS_PREFIX:-knowledge/}"
  OSS_ACCESS_KEY_ID: "${OSS_ACCESS_KEY_ID:-}"
  OSS_ACCESS_KEY_SECRET: "${OSS_ACCESS_KEY_SECRET:-}"
  TZ: Asia/Shanghai

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:-ai_interview}"
      MYSQL_USER: "${MYSQL_USER:-ai_interview}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.production}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging
    networks: [app_network]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-ai_interview}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.production}"
      RABBITMQ_DEFAULT_VHOST: /
      TZ: Asia/Shanghai
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_BIND:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    logging: *default-logging
    networks: [app_network]

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    logging: *default-logging
    networks: [app_network]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    logging: *default-logging
    networks: [app_network]

  resume-worker:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.workers.resume_worker"]
    healthcheck:
      disable: true
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging: *default-logging
    networks: [app_network]

  knowledge-worker:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.workers.knowledge_worker"]
    healthcheck:
      disable: true
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    logging: *default-logging
    networks: [app_network]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    networks: [app_network]

volumes:
  mysql_data:
  rabbitmq_data:
  qdrant_data:

networks:
  app_network:
    driver: bridge
